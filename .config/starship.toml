# Starship prompt configuration
# https://starship.rs/config/

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

# The github repo / worktree / PR segments are populated fork-free by
# ~/.config/starship/github-prompt.zsh (sourced from .zshrc) and surfaced here
# as [env_var] modules. env_var reads cost nothing; the old [custom.*] modules
# each forked a shell just to evaluate their `when:` condition, which is what
# made this prompt slow under SentinelOne's per-spawn latency tax.
format = '${env_var.github_repo}${env_var.worktree}$directory$character'
right_format = '$cmd_duration$git_branch${env_var.github_pr}$git_status'

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# org/repo for paths under ~/github (worktree repo--branch dirs collapse to repo).
# Fed by $STARSHIP_GH_REPO; see github-prompt.zsh.
[env_var.github_repo]
variable = "STARSHIP_GH_REPO"
format = '[github\([$env_value](green bold underline)\)](green italic) '

# Worktree branch suffix (the repo--branch convention). Fed by $STARSHIP_GH_WT.
[env_var.worktree]
variable = "STARSHIP_GH_WT"
format = '[{$env_value}](bold yellow) '

# GitHub PR badge (#number colored by PR state). Fed by $STARSHIP_GH_PR, which
# is computed by a background worker with stale-while-revalidate caching.
[env_var.github_pr]
variable = "STARSHIP_GH_PR"
format = '$env_value '

[git_branch]
symbol = " "
style = "bold purple"
format = '[$symbol$branch]($style) '

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?"
stashed = "\\$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 2_000
format = '[$duration]($style) '
style = "dimmed yellow"

[directory]
truncate_to_repo = true
repo_root_format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_style = "cyan bold"
